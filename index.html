<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My GitHub Repositories</title>
</head>
<body>
    <h1>My Repositories</h1>
    <ul id="repo-list"></ul>

    <script>
        const username = 'AvaCaine'; // Replace with your username
        const listElement = document.getElementById('repo-list');

        fetch(`api.github.com{username}/repos?sort=updated&per_page=100`)
            .then(response => response.json())
            .then(repos => {
                repos.forEach(repo => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `<a href="${repo.html_url}" target="_blank">${repo.name}</a>: ${repo.description || 'No description'}`;
                    listElement.appendChild(listItem);
                });
            })
            .catch(error => {
                console.error('Error fetching repositories:', error);
                listElement.innerHTML = 'Failed to load repositories.';
            });
    </script>
</body>
</html>
